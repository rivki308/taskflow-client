# Render Blueprint - TaskFlow Pro client
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: taskflow-client
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # React Router: every path is served by index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Server address without /api at the end, e.g. https://taskflow-pro-api.onrender.com
      - key: VITE_API_URL
        sync: false
